<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="road" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="potholeDepth" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="url(#road)" />
  <!-- Road White/Yellow dividing line -->
  <line x1="20" y1="150" x2="110" y2="150" stroke="#f1f5f9" stroke-width="6" stroke-dasharray="25,20" opacity="0.8" />
  <line x1="290" y1="150" x2="380" y2="150" stroke="#f1f5f9" stroke-width="6" stroke-dasharray="25,20" opacity="0.8" />
  <!-- Asphalt texture cracks -->
  <path d="M 80 130 L 140 145 L 160 120" stroke="#1e293b" stroke-width="2" fill="none" opacity="0.7" />
  <path d="M 260 170 L 290 190 L 330 160" stroke="#1e293b" stroke-width="2" fill="none" opacity="0.7" />
  <!-- Pothole crater -->
  <ellipse cx="200" cy="155" rx="90" ry="50" fill="url(#potholeDepth)" stroke="#1e293b" stroke-width="3" />
  <ellipse cx="195" cy="152" rx="55" ry="25" fill="#020617" />
  <path d="M 125 145 Q 160 130 210 140 Q 265 125 275 160 Q 240 190 190 185 Q 135 175 125 145 Z" fill="none" stroke="#64748b" stroke-width="2" opacity="0.5" />
</svg>
